name: Deploy Vue to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./vue

      - name: Build
        run: npm run build
        #		env:
        #         VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
        working-directory: ./vue

      - name: Copy images to dist
        run: |
          if [ -d "public/images" ]; then
            cp -r public/images dist/images
          fi
        working-directory: ./vue

      - name: Verify dist/images exists
        run: ls -la ./dist/images
        working-directory: ./vue

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./vue/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
